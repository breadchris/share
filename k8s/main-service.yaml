apiVersion: v1
kind: Service
metadata:
  name: share-main-service
  namespace: share-main
  labels:
    app: share-main
    component: web-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: share-main
    component: web-service
---
apiVersion: v1
kind: Service
metadata:
  name: share-main-nodeport
  namespace: share-main
  labels:
    app: share-main
    component: web-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 30100
  selector:
    app: share-main
    component: web-service