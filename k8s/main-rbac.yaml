apiVersion: v1
kind: ServiceAccount
metadata:
  name: share-main
  namespace: share-main
  labels:
    app: share-main
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: share-main
  labels:
    app: share-main
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: share-main
  labels:
    app: share-main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: share-main
subjects:
- kind: ServiceAccount
  name: share-main
  namespace: share-main