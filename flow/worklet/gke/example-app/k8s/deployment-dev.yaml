apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-worklet-app
  labels:
    app: flow-worklet
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-worklet
  template:
    metadata:
      labels:
        app: flow-worklet
        environment: development
    spec:
      containers:
      - name: app
        image: gcr.io/planar-sun-402202/flow-worklet-example
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: ENV
          value: "development"
        - name: DEBUG_MODE
          value: "true"
        - name: LOG_LEVEL
          value: "debug"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 5