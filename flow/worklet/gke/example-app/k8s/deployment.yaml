apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-worklet-app
  labels:
    app: flow-worklet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flow-worklet
  template:
    metadata:
      labels:
        app: flow-worklet
    spec:
      containers:
      - name: app
        image: gcr.io/planar-sun-402202/flow-worklet-example:3b4433e-dirty
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5