apiVersion: v1
kind: Service
metadata:
  name: flow-worklet-service
  labels:
    app: flow-worklet
spec:
  selector:
    app: flow-worklet
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: debug
    port: 40000
    targetPort: 40000
    protocol: TCP
  type: ClusterIP
