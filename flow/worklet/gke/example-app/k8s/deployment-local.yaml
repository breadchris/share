apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-worklet-app
  labels:
    app: flow-worklet
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-worklet
  template:
    metadata:
      labels:
        app: flow-worklet
        environment: local
    spec:
      containers:
      - name: app
        image: flow-worklet-example  # Local image, no registry
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: ENV
          value: "development"
        - name: DEBUG_MODE
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
