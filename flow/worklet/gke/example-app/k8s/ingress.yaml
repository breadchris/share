apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flow-worklet-ingress
  labels:
    app: flow-worklet
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "letsencrypt"
    traefik.ingress.kubernetes.io/router.middlewares: "default-security-headers@kubernetescrd"
spec:
  tls:
  - hosts:
    - flow-worklet.baked.mom
    secretName: flow-worklet-tls
  rules:
  - host: flow-worklet.baked.mom
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flow-worklet-service
            port:
              number: 80
