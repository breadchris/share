# dnsmasq configuration for worklet.local domain routing
# This file should be placed at /usr/local/etc/dnsmasq.conf

# Only bind to localhost to avoid conflicts with system DNS
bind-interfaces
listen-address=127.0.0.1

# Use port 53533 to avoid conflicts with system DNS
port=53533

# Don't read /etc/hosts
no-hosts

# Don't read /etc/resolv.conf for upstream servers
no-resolv

# Set upstream DNS servers (Google DNS)
server=8.8.8.8
server=8.8.4.4

# Route all .worklet.local domains to localhost (where Kind cluster is running)
address=/worklet.local/127.0.0.1

# Route all subdomains of worklet.local to localhost
address=/.worklet.local/127.0.0.1

# Enable DNS caching
cache-size=1000

# Log DNS queries for debugging (comment out in production)
log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log

# Don't forward queries for these domains to upstream servers
local=/worklet.local/

# Expand hosts entries to include subdomains
expand-hosts

# Set domain for DHCP clients (not used but good practice)
domain=worklet.local

# Don't provide DNS for DHCP clients (we only want DNS service)
no-dhcp-interface=