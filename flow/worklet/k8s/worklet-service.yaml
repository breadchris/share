apiVersion: v1
kind: Service
metadata:
  name: flow-worklet-service
  namespace: flow-worklet
  labels:
    app: flow-worklet
    component: worklet-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: flow-worklet
    component: worklet-service
---
apiVersion: v1
kind: Service
metadata:
  name: flow-worklet-nodeport
  namespace: flow-worklet
  labels:
    app: flow-worklet
    component: worklet-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 30090
  selector:
    app: flow-worklet
    component: worklet-service