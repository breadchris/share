apiVersion: v1
kind: Secret
metadata:
  name: flow-worklet-secrets
  namespace: flow-worklet
  labels:
    app: flow-worklet
type: Opaque
data:
  # Base64 encoded GitHub token - replace with your actual token
  # To encode: echo -n "your_github_token" | base64
  github-token: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-worklet-config
  namespace: flow-worklet
  labels:
    app: flow-worklet
data:
  worklet.yaml: |
    server:
      port: 8080
      host: "0.0.0.0"
    worklet:
      domain: "worklet.local"
      base_dir: "/tmp/worklet-repos"
      max_concurrent: 10
      timeout: "30m"
    docker:
      socket: "/var/run/docker.sock"
      network: "kind"
    kubernetes:
      namespace: "flow-worklet"
      create_ingress: true
      ingress_class: "traefik"